schema_version: "1.0"

opportunity:
  id: "CRETONA-OPP-001"
  status: "ready-for-decision"
  mode: "explore"
  objective: "Clarify a feasible Mobile 1 AI-video product direction and provide traceable inputs for a provisional SRS and a two-developer work split."
  project_id: "CRETONA"
  as_of_date: "2026-08-06"
  maturity_contribution: "L0-input-only"

routing:
  orchestrator: "build-software-project"
  handoff_target: "Cretona Project DNA and requirements definition after team selection"
  specialist_self_activation: false
  reroute_recommendations:
    - "Use build-software-project after Bruce and S0ra1n0 select a candidate."
    - "Use design-api-and-event-contracts before Android and FastAPI implementation diverge."

authority:
  decision_authority: "Bruce and S0ra1n0, subject to instructor requirements"
  selected_candidate_id: ""
  project_dna_authorized: false
  l0_approved: false
  market_demand_proven: false
  product_market_fit_claimed: false

scope:
  geographies:
    - "Vietnam for classroom delivery; provider availability may be regional"
  languages:
    - "Vietnamese for team documentation"
    - "English for API and code identifiers"
  included_segments:
    - "Mobile 1 instructor/evaluator"
    - "Two-person student development team"
    - "Hypothesized beginner creator using an Android phone"
  excluded_segments:
    - "Production media studios"
    - "Enterprise organizations"
    - "Children-specific product"
  include:
    - "Text-to-video and image-guided video opportunity directions"
    - "FastAPI as the required server-side AI integration boundary"
    - "Authentication, generation history, and basic role management stated in the repository"
    - "Current first-party API capability and cost evidence"
  exclude:
    - "Implementation or provider account creation"
    - "Training or hosting a video-generation foundation model"
    - "Production deployment, market sizing, or product-market-fit claims"
  non_goals:
    - "Copy a commercial editor or bypass provider access controls"
    - "Build a full timeline video editor"
    - "Support multiple paid providers in the first MVP"
    - "Promise free video generation where the provider charges per generation"
  research_budget: "Bounded desk research using the repository, current conversation, and first-party public documentation. No interviews or paid API calls."
  cutoff_date: "2026-08-06"

inputs:
  provided_artifacts:
    - id: "SRC-001"
      kind: "repository-readme"
      locator: "README.md"
      owner_or_publisher: "Cretona team"
      publication_or_update_date: "2026-08-06"
      observation_date: "2026-08-06"
      reliability_notes: "Only one product sentence existed before this discovery; no approved SRS or implementation was present."
    - id: "SRC-002"
