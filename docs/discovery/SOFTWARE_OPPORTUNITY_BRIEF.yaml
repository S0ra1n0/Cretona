  claims:
    - id: "CLM-001"
      evidence_label: "source-stated"
      source_ids: ["SRC-001"]
      confidence: "high"
      statement: "Cretona was described as a mobile app that generates AI video from text, images, or both through external APIs and includes authentication and role management."
    - id: "CLM-002"
      evidence_label: "user-stated"
      source_ids: ["SRC-002"]
      confidence: "medium"
      statement: "The instructor requires FastAPI to call LLM/model services and otherwise leaves product and stack choices to the team."
    - id: "CLM-003"
      evidence_label: "source-stated"
      source_ids: ["SRC-003", "SRC-005", "SRC-006"]
      confidence: "high"
      statement: "Current provider APIs support starting video generation from text and, depending on model, a reference image."
    - id: "CLM-004"
      evidence_label: "derived"
      source_ids: ["SRC-003", "SRC-005", "SRC-006", "SRC-011"]
      confidence: "high"
      statement: "Generation must be modeled as a long-running job with a server-side identifier and explicit lifecycle states rather than one blocking mobile request."
    - id: "CLM-005"
      evidence_label: "source-stated"
      source_ids: ["SRC-004", "SRC-007"]
      confidence: "high"
      statement: "Video-generation APIs can require paid access and charge per generated second or provider credit."
    - id: "CLM-006"
      evidence_label: "inferred"
      source_ids: ["SRC-008", "SRC-009", "SRC-010"]
      confidence: "medium"
      statement: "A generic AI video generator has weak market differentiation because established tools already provide prompt/image generation plus editing and export."
    - id: "CLM-007"
      evidence_label: "source-stated"
      source_ids: ["SRC-012"]
      confidence: "high"
      statement: "Kling VIDEO 3.0 is documented to support text and image input, multi-shot generation, native audio, and clips from 3 to 15 seconds."
    - id: "CLM-008"
      evidence_label: "source-stated"
      source_ids: ["SRC-013", "SRC-014", "SRC-015"]
      confidence: "high"
      statement: "The fal catalog exposes multiple video model families, including Kling, Veo, Sora, and Seedance, through a shared SDK and billing surface."
    - id: "CLM-009"
      evidence_label: "inferred"
      source_ids: ["SRC-014", "SRC-015", "SRC-016", "SRC-017", "SRC-018"]
      confidence: "medium"
      statement: "Price alone does not establish superior output quality because published rates differ by resolution, audio, duration, model family, and platform packaging; a controlled benchmark is required."
    - id: "CLM-010"
      evidence_label: "source-stated"
      source_ids: ["SRC-019"]
      confidence: "high"
      statement: "Gemini 2.5 Flash currently has free-tier text input and output, while the same pricing table marks free-tier requests as used to improve Google products."
    - id: "CLM-011"
      evidence_label: "source-stated"
      source_ids: ["SRC-020"]
      confidence: "high"
      statement: "The Wan2.1 T2V 1.3B publisher model card describes a text-to-video model requiring about 8.19 GB of VRAM, making zero-API-cost generation conditional on compatible local hardware."
    - id: "CLM-012"
      evidence_label: "source-stated"
      source_ids: ["SRC-021"]
      confidence: "high"
      statement: "Hugging Face currently provides free users only USD 0.10 of monthly Inference Providers credit, subject to change, which is insufficient as a sustainable free video backend."
    - id: "CLM-013"
      evidence_label: "source-stated"
      source_ids: ["SRC-023"]
      confidence: "high"
      statement: "The available project laptop has an RTX 3070 Ti Laptop GPU with 8 GB VRAM, 15,629 MB system RAM, and sufficient D-drive storage, making system RAM and model offload the key free-local constraints."
    - id: "CLM-014"
      evidence_label: "source-stated"
      source_ids: ["SRC-024"]
      confidence: "high"
      statement: "FramePack officially supports Windows RTX 30-series laptops with at least 6 GB VRAM and reports RTX 3070 Ti laptop generation at roughly four to eight times the per-frame time of an RTX 4090."
    - id: "CLM-015"
      evidence_label: "source-stated"
      source_ids: ["SRC-025"]
      confidence: "high"
      statement: "The LTX-Video repository provides distilled 2B T2V/I2V checkpoints and reports a Q8 720x480x121 run under one minute on an RTX 4060 with 8 GB VRAM."
    - id: "CLM-016"
      evidence_label: "derived"
      source_ids: ["SRC-023", "SRC-024", "SRC-025", "SRC-026", "SRC-027"]
      confidence: "medium"
      statement: "For the measured laptop, LTX-Video 2B Q8 is the strongest documented complete-input Standard candidate, while FramePack F1 is the stronger image-conditioned quality challenger; neither local output has been verified."
  contradictions:
    - id: "CON-001"
      description: "The instructor wording says LLMs, while the repository goal requires video-generation models. It is unknown whether a separate text LLM call, such as prompt enhancement, is mandatory."
      affected_ids: ["CLM-001", "CLM-002"]
  coverage_limits:
    - "No actual end-user interviews, surveys, analytics, or usability observations were run."
    - "No provider account eligibility, Vietnam availability, quota, latency, or output quality was tested."
    - "No paid benchmark has been run; all price and capability comparisons are documentation evidence rather than runtime proof."
    - "The device GPU/RAM/disk inventory was observed, but no LTX, FramePack, Hunyuan, Wan, CogVideo or local-LLM inference spike has been run."
    - "No instructor rubric, required Android UI technology, submission deadline, or deployment rule was supplied."
    - "Competitor coverage is bounded and does not claim an exhaustive market scan."

discovery:
  actors:
    - id: "ACT-001"
      name: "Creator user"
      evidence_label: "inferred"
      role: "Submits a prompt and optional image, waits for generation, then views or downloads the result."
    - id: "ACT-002"
      name: "Administrator"
      evidence_label: "source-stated"
      role: "Manages user access and observes generation activity within a limited academic MVP."
    - id: "ACT-003"
      name: "Instructor/evaluator"
      evidence_label: "user-stated"
      role: "Sets mandatory technical constraints and evaluates the delivered project."
    - id: "ACT-004"
      name: "Two-person development team"
      evidence_label: "user-stated"
      role: "Bruce and S0ra1n0 implement, test, demonstrate, and explain the system."
  outcomes_and_jobs:
    - id: "OUT-001"
      actor_id: "ACT-001"
      evidence_label: "inferred"
      desired_outcome: "Turn a short creative idea into a playable short video from an Android device without handling provider credentials."
      success_measure: "A valid submission reaches a terminal state and a successful result can be played or downloaded."
    - id: "OUT-002"
      actor_id: "ACT-003"
      evidence_label: "user-stated"
      desired_outcome: "Observe a working Android-to-FastAPI-to-model integration that the team can explain and demonstrate."
      success_measure: "The critical path is executed live or with recorded evidence and failures are handled visibly."
  current_workflows:
    - id: "WF-001"
      evidence_label: "derived"
      trigger: "User wants a generated clip."
      steps:
        - "Open a commercial web/mobile generator."
        - "Enter a prompt and optionally upload an image."
        - "Choose generation options and spend credits if required."
        - "Wait for generation, review output, then download/export."
      handoffs_and_failures:
        - "Account, credits, moderation, queue latency, and provider failure can block completion."
        - "A custom app must protect the shared provider key and attribute jobs to users."
  pain_evidence:
    - id: "PAIN-001"
      evidence_label: "unknown"
      statement: "No observed user pain has been established; ease-of-use and classroom learning value are hypotheses."
  constraints:
    - id: "CST-001"
      evidence_label: "user-stated"
      statement: "FastAPI is mandatory as the server-side model integration boundary."
    - id: "CST-002"
      evidence_label: "derived"
      statement: "Provider API secrets must remain on the backend and outside Git."
    - id: "CST-003"
      evidence_label: "derived"
      statement: "The MVP must control video duration, retry behavior, and per-user generation volume to bound paid API cost."
    - id: "CST-004"
      evidence_label: "user-stated"
      statement: "The implementation team contains exactly two developers: Bruce and S0ra1n0."
  unknowns:
    - id: "UNK-001"
      question: "What is the exact deadline, grading rubric, demo format, and minimum required feature set?"
      blocking_stage: "scope approval"
    - id: "UNK-002"
      question: "Must Android use Kotlin with XML Views, Jetpack Compose, or another instructor-specified UI stack?"
      blocking_stage: "architecture"
    - id: "UNK-003"
      question: "Which provider account and budget can the team legally and reliably use for the final demo?"
      blocking_stage: "build readiness"
    - id: "UNK-004"
      question: "Does the FastAPI requirement demand a separate text LLM call, or is calling a generative video model sufficient?"
      blocking_stage: "requirements approval"
    - id: "UNK-005"
      question: "Must the backend be deployed publicly, or may it run on a team laptop during the demo?"
      blocking_stage: "release planning"

research:
  questions:
    - "Which smallest video-generation flow demonstrates the required learning outcomes without making paid-provider availability the whole project?"
    - "Which features are core for grading and which are optional product polish?"
    - "What provider and cost ceiling will the team approve?"
  interview_plan:
    status: "not-run"
    target_participants:
      - "Course instructor"
      - "Two to three classmates who have tried AI media tools"
    method: "One short rubric clarification with the instructor, then task-based prototype observation; do not ask whether participants merely like the idea."
    consent_and_privacy:
      - "Do not collect credentials, API keys, or personal images."
      - "Record only task observations with participant consent."
  limitations:
    - "Desk research cannot prove demand or usability."
    - "Provider documentation can change before implementation."

