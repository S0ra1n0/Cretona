    source_revision: "b60fe5f plus the working-tree notebook restructure (one clip per cell)"
    artifact_digest: "sha256:f7178381add6cd09ba47529787efa97ffc858a34ecb32a97fc3253de209da707 (A1), 4aa7bad5e208d0750565f29999dc82d16b3df3e8aadaa2f9b8f1e6ddf6045c96 (A2), a32a4d452cc04cff042c20f08b3e7b90580bfefb3102a6556843e5d9239aada7 (B1), 4d75e3771bb6bc636975304618232717f018b1ab354a38e5e1672cea0a3e2abf (B2)"
