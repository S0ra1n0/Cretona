      - "This is a generation-validity result, not a quality result. QUALITY_SCORECARD.md is unscored, so the model remains unverified on quality and no pass against PB-FRAMEPACK-QUALITY's 73/100 bar is claimed."
      - "Latency is 48.6 min per clip, 2.7x the earlier ~10.4 min figure, which was measured at 50 frames and on a run later invalidated by the grey-clip bug. 81 frames is 1.62x the frames for 4.7x the time; attention cost is superlinear in frame count."
      - "48.6 min exceeds the only generation-latency blocking threshold the contract states, PB-FRAMEPACK-LATENCY at 1800 s, by 62 percent. That budget is written for the local FramePack path, so this is an unbudgeted workload rather than a recorded breach."
      - "Peak RAM reached 29.13 GiB of 31.35 GiB, 93 percent of the host. Headroom is about 2.2 GiB and any increase in frames, batch, or resident state is likely to hit the RAM ceiling that caused the 2026-08-23 failures."
