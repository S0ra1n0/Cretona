name: CI

on:
  push:
    branches: [main, khoa]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: FastAPI / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/constraints-windows-py312.lock

      - name: Install locked environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip==26.2.1
          .\.venv\Scripts\python.exe -m pip install -c constraints-windows-py312.lock -e ".[dev]"

      - name: Verify dependency consistency
        run: .\.venv\Scripts\python.exe -m pip check

      - name: Audit Python dependencies
        run: .\.venv\Scripts\python.exe -m pip_audit --local --progress-spinner off

      - name: Lint and formatting
        run: |
          .\.venv\Scripts\python.exe -m ruff check .
          .\.venv\Scripts\python.exe -m ruff format --check .

      - name: Run backend tests
        run: .\.venv\Scripts\python.exe -m pytest

  backend-postgres:
    name: FastAPI / PostgreSQL 17 parity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: cretona_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cretona_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        shell: bash
        working-directory: backend
    env:
      CRETONA_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/cretona_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/constraints-windows-py312.lock

      - name: Install constrained environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip==26.2.1
          .venv/bin/python -m pip install -c constraints-windows-py312.lock -e ".[dev]"

      - name: Verify dependency consistency
        run: .venv/bin/python -m pip check

      - name: Audit Python dependencies
        run: .venv/bin/python -m pip_audit --local --progress-spinner off

      - name: Run full suite with Postgres parity enabled
        run: .venv/bin/python -m pytest

  android:
    name: Android / JVM 17
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Gradle wrapper JAR
        shell: bash
        run: echo "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict -

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Install Android API 37
        shell: bash
        run: |
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" "platforms;android-37" --channel=3

      - name: Test, lint, and build Android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:compileDebugAndroidTestKotlin --no-daemon
