name: CI

on:
  push:
    branches: [main, khoa]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: FastAPI / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/constraints-windows-py312.lock

      - name: Install locked environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -c constraints-windows-py312.lock -e ".[dev]"

      - name: Verify dependency consistency
        run: .\.venv\Scripts\python.exe -m pip check

      - name: Lint and formatting
        run: |
          .\.venv\Scripts\python.exe -m ruff check .
          .\.venv\Scripts\python.exe -m ruff format --check .

      - name: Run backend tests
        run: .\.venv\Scripts\python.exe -m pytest

  android:
    name: Android / JVM 17
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify Gradle wrapper JAR
        shell: bash
        run: echo "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict -

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Verify Android API 37
        run: test -f "$ANDROID_HOME/platforms/android-37/android.jar"

      - name: Test, lint, and build Android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:compileDebugAndroidTestKotlin --no-daemon
